[package]
name = "klavyn-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM bindings for klavyn-core: in-browser chord lookup for the demo site."
license = "MIT OR Apache-2.0"
repository = "https://github.com/klavyn/klavyn"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
klavyn-core = { path = "../core" }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = ["console"]
