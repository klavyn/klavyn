[workspace]
members = ["core", "wasm"]
# wasm builds only via wasm-pack (wasm32 target); keep it out of the
# default native build/test so `cargo build` / `cargo test` stay green.
default-members = [".", "core"]

[package]
name = "acchordion"
version = "0.1.0"
edition = "2024"
description = "A QWERTY chorded-typing trainer: press a word's letters at once, get the word."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickvigilante/acchordion"

[dependencies]
acchordion-core = { path = "core" }
rdev = "0.5"
enigo = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
