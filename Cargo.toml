[package]
name = "acchordion"
version = "0.1.0"
edition = "2024"
description = "A QWERTY chorded-typing trainer: press a word's letters at once, get the word."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickvigilante/acchordion"

[dependencies]
rdev = "0.5"
enigo = "0.6"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
